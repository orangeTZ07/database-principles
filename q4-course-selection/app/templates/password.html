{% extends 'base.html' %}
{% block body %}
<div class="card narrow">
  <h2>修改密码</h2>
  <form method="post">{{ csrf }}
    <label>原密码<input name="old" type="password" required></label>
    <label>新密码（至少 6 位）<input name="new" type="password" required></label>
    <label>确认新密码<input name="new2" type="password" required></label>
    <button class="btn primary">保存</button>
  </form>
</div>
{% endblock %}
